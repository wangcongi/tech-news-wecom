name: Schedule Smoke Test

on:
  workflow_dispatch: {}
  schedule:
    # Every 5 minutes (GitHub minimum) for quick verification.
    - cron: "*/5 * * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Show context
        run: |
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          date -u
