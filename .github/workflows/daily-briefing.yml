name: Daily Tech Briefing (WeCom)

on:
  workflow_dispatch: {}
  schedule:
    # GitHub Actions cron uses UTC. 08:57 Asia/Shanghai == 00:57 UTC.
    - cron: "57 0 * * *"

concurrency:
  group: daily-tech-briefing
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore seen cache
        uses: actions/cache@v4
        with:
          path: data/seen.sqlite3
          key: seen-sqlite-v1

      - name: Run once
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          MAX_ITEMS: ${{ secrets.MAX_ITEMS }}
          CONCEPTS_PATH: ${{ secrets.CONCEPTS_PATH }}
          WECOM_MODE: ${{ secrets.WECOM_MODE }}
          WECOM_CORPID: ${{ secrets.WECOM_CORPID }}
          WECOM_CORPSECRET: ${{ secrets.WECOM_CORPSECRET }}
          WECOM_AGENTID: ${{ secrets.WECOM_AGENTID }}
          WECOM_TOUSER: ${{ secrets.WECOM_TOUSER }}
          WECOM_TOPARTY: ${{ secrets.WECOM_TOPARTY }}
          WECOM_TOTAG: ${{ secrets.WECOM_TOTAG }}
        run: |
          python -m tech_news_wecom.cli run-once
