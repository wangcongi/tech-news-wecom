name: Daily Tech Briefing (WeCom)

on:
  workflow_dispatch: {}
  schedule:
    # GitHub Actions cron uses UTC. 07:00 Asia/Shanghai == 23:00 UTC (previous day).
    - cron: "0 23 * * *"

concurrency:
  group: daily-tech-briefing
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore seen cache
        uses: actions/cache@v4
        with:
          path: data/seen.sqlite3
          key: seen-sqlite-v1

      - name: Run once
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          MAX_ITEMS: ${{ secrets.MAX_ITEMS }}
        run: |
          python -m tech_news_wecom.cli run-once

